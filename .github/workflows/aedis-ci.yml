# Quality pipeline of this action: Conventional Commits, SAST (Semgrep with the Aedis rules) and REUSE through the
# Aedis Platform reusables, the tests of the summary, the acceptances and the auth helper (unit self-tests and
# fixtures), and the action itself (ZAP per path and the edge check) against a static site served in the job. The
# gate (gate.yml) listens for the end of this workflow on pull requests.
name: aedis-ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# One run per pull request: a new push or closing the PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  commits:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/conventional-commits.yml@c096e93f15a76e52fa793868fc82b74587cb9ca0 # v1.2.0
    permissions:
      contents: read

  sast:
    if: github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/sast.yml@c096e93f15a76e52fa793868fc82b74587cb9ca0 # v1.2.0
    permissions:
      contents: read
      security-events: write

  test:
    if: github.event.action != 'closed'
    name: Self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash test/run.sh
      - run: pipx run reuse==5.0.2 lint

  dast:
    if: github.event.action != 'closed'
    name: DAST against a static site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Serve the test site
        run: |
          set -euo pipefail
          (cd test/site && python3 -m http.server 8080 >/dev/null 2>&1 &)
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://localhost:8080/
      # A bare http.server has no security headers: Medium findings from ZAP and the edge check, none High, so the
      # default gate passes. Nuclei stays out of the pull request pipeline (minutes of templates); e2e.yml runs it.
      - uses: ./
        id: dast
        with:
          target-url: http://localhost:8080/
          target-paths: /llms-full.txt
          accept-file: test/dast-accept.yaml
          edge: true
      - name: The summary says what the gate saw
        env:
          RESULT: ${{ steps.dast.outputs.result }}
        run: |
          set -euo pipefail
          test "$RESULT" = pass
          python3 -c "import json; s=json.load(open('dast/dast-summary.json')); assert s['schema']=='aedis.platform/dast-summary/v2' and s['result']=='pass' and s['counts']['high']==0 and s['tools']['edge']['ran'] and len(s['targets'])==2, s"
      # Session auth: ZAP runs in its container as its own user and must read the auth files the helper wrote on the
      # host (group-readable, through docker run --group-add). Runs after the assertions above: same dast/ directory.
      - uses: ./
        with:
          target-url: http://localhost:8080/
          accept-file: test/dast-accept.yaml
          summary-name: dast-summary-session
          auth: session
          login-command: |
            printf '%s' '{"headers": {"X-Test-Session": "abc def"}, "cookies": {"sid": "1"}}'
      - name: The session scan ran authenticated
        run: |
          set -euo pipefail
          python3 -c "import json; s=json.load(open('dast/dast-summary.json')); assert s['authenticated'] is True and s['authMode']=='session' and s['tools']['zap']['ran'], s"
