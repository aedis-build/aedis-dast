# Dynamic scan (OWASP ZAP baseline) against the target URL, run in the caller's job after the application is up:
# the ZAP report becomes the JSON summary aedis.platform/dast-summary/v1, and the job fails when an alert at or above
# the configured risk is not accepted, with an expiry date, in dast-accept.yaml. Needs Docker on the runner
# (ubuntu-latest has it) and the application reachable from the host network.
name: Aedis DAST
description: >-
  OWASP ZAP baseline scan against a URL with a JSON summary and a gate: alerts at the configured risk fail the job
  unless accepted, with an expiry date and optional paths, in dast-accept.yaml.
author: Aedis
branding:
  icon: shield
  color: purple
inputs:
  target-url:
    description: "URL of the exposed surface (e.g. http://localhost:8080/)"
    required: true
  accept-file:
    description: Risk acceptance file (list of pluginId, until, reason and, optionally, paths)
    default: dast-accept.yaml
  fail-on:
    description: Lowest risk that fails the job (High or Medium)
    default: High
  summary-name:
    description: Name of the artifact with the report and the summary
    default: dast-summary
runs:
  using: composite
  steps:
    - name: ZAP baseline
      shell: bash
      env:
        TARGET: ${{ inputs.target-url }}
      run: |
        set -euo pipefail
        mkdir -p dast && chmod 777 dast
        # -I: warnings do not change the exit code; the summary decides, honouring the acceptances.
        docker run --rm --network host -v "$PWD/dast:/zap/wrk:rw" \
          ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 \
          zap-baseline.py -t "$TARGET" -J report.json -I -m 2 || true
        test -f dast/report.json || { echo "::error::ZAP produced no dast/report.json"; exit 1; }
    - name: Summary and gate
      shell: bash
      env:
        TARGET: ${{ inputs.target-url }}
        ACCEPT: ${{ inputs.accept-file }}
        FAIL_ON: ${{ inputs.fail-on }}
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "$ACTION_PATH/dast-summary.py" --report dast/report.json --accept "$ACCEPT" --fail-on "$FAIL_ON" --target "$TARGET" --out dast/dast-summary.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: ${{ inputs.summary-name }}
        path: dast/
